<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textarea Sync</title>
<link rel="stylesheet" href="popup.css">
<main>
  <h1>Textarea Sync</h1>

</main>
